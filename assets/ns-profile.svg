<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title">
<title id="title">NS profile mark</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202330"/><stop offset="1" stop-color="#292c3a"/></linearGradient>
<linearGradient id="pink" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#d93678"/><stop offset=".55" stop-color="#ff5f91"/><stop offset="1" stop-color="#ff78a7"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="600" height="380" rx="18" fill="url(#bg)"/>
<circle cx="300" cy="190" r="105" fill="#222531" stroke="url(#pink)" stroke-width="12" filter="url(#glow)"/>
<circle cx="300" cy="190" r="105" fill="none" stroke="#ff729f" stroke-width="12" stroke-linecap="round" stroke-dasharray="145 515" transform="rotate(-72 300 190)"/>
<text x="300" y="217" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" letter-spacing="-6">NS</text>
</svg>