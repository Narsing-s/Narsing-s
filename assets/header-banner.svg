<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Narsingarao profile banner</title>
  <desc id="desc">Narsingarao, MuleSoft Production Support Engineer and Integration Specialist, with an NS monogram badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="0.55" stop-color="#242938"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="0.5" stop-color="#ff3f88"/>
      <stop offset="1" stop-color="#d92670"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1430" cy="80" r="125" fill="#8250df" opacity=".08"/>
  <circle cx="1510" cy="275" r="180" fill="#00A0DF" opacity=".06"/>

  <g transform="translate(90 65)">
    <text x="0" y="62" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Hey, I'm Narsingarao 👋</text>
    <text x="0" y="122" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">MuleSoft Production Support Engineer • Integration Specialist</text>
    <text x="0" y="172" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="22">APIs • SQL • PostgreSQL • DevOps • AI • Open Source</text>
    <text x="0" y="237" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="20">Building, supporting and improving production-grade systems.</text>
  </g>

  <g transform="translate(1350 180)" filter="url(#glow)">
    <circle r="105" fill="#111622" stroke="url(#ring)" stroke-width="12"/>
    <circle r="105" fill="none" stroke="#ff78a7" stroke-width="12" stroke-linecap="round" stroke-dasharray="165 495" transform="rotate(-72)" opacity=".9"/>
    <text x="0" y="22" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-7">NS</text>
  </g>
</svg>