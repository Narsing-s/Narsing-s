name: GitHub Repository Monitor

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-repository-monitor
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
      - name: Generate activity report and email it
        env:
          GH_MONITOR_TOKEN: ${{ secrets.GH_MONITOR_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python3 scripts/github-repository-monitor.py
