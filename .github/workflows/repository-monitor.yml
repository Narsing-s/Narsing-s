name: GitHub Repository Monitor

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-repository-monitor
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
      - name: Generate analytics data and email report
        env:
          GH_MONITOR_TOKEN: ${{ secrets.GH_MONITOR_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python3 scripts/github-repository-monitor.py
      - name: Upload dashboard for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-dashboard:
    needs: report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy interactive dashboard
        id: deployment
        uses: actions/deploy-pages@v4
